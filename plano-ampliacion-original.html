<header class="top">

  </div>
  <p class="rotulo">Medidas estimadas por foto y boceto.<br>No apto para obra.</p>
</header>

    </div>
    <ul class="refs" id="refs"></ul>
  </section>
  <section class="escena" id="vista-modelo" role="tabpanel" aria-labelledby="tab-modelo" hidden>

/* ============================================================
   PLANO 2D (SVG). 1 m = 20 unidades.
   ============================================================ */
const Plano = (() => {
  const K = 20;
  const u = n => +(n * K).toFixed(2);
  const svg = document.getElementById('svg');
  const R = (x0, y0, x1, y1, cls, extra = '') =>
    `<rect x="${u(x0)}" y="${u(y0)}" width="${u(x1 - x0)}" height="${u(y1 - y0)}" class="${cls}" ${extra}/>`;
  const L = (x0, y0, x1, y1, cls, extra = '') =>
    `<line x1="${u(x0)}" y1="${u(y0)}" x2="${u(x1)}" y2="${u(y1)}" class="${cls}" ${extra}/>`;
  const C = (x, y, r, cls) => `<circle cx="${u(x)}" cy="${u(y)}" r="${u(r)}" class="${cls}"/>`;
  const T = (x, y, s, cls = '', rot = 0) =>
    `<text x="${u(x)}" y="${u(y)}" class="t ${cls}" ${rot ? `transform="rotate(${rot} ${u(x)} ${u(y)})"` : ''}>${s}</text>`;
  const poly = p => p.map(a => a.map(u).join(',')).join(' ');
  const nf = n => n.toFixed(2).replace('.', ',');

  /* Camino con esquinas redondeadas */
  function camino(p, r = 1) {
    let d = `M${u(p[0][0])} ${u(p[0][1])}`;
    for (let i = 1; i < p.length; i++) {
      const a = p[i - 1], b = p[i], c = p[i + 1];
      if (!c) { d += `L${u(b[0])} ${u(b[1])}`; break; }
      const la = Math.hypot(b[0] - a[0], b[1] - a[1]), lc = Math.hypot(c[0] - b[0], c[1] - b[1]);
      const k = Math.min(r, la / 2, lc / 2);
      d += `L${u(b[0] + (a[0] - b[0]) / la * k)} ${u(b[1] + (a[1] - b[1]) / la * k)}`;
      d += `Q${u(b[0])} ${u(b[1])} ${u(b[0] + (c[0] - b[0]) / lc * k)} ${u(b[1] + (c[1] - b[1]) / lc * k)}`;
    }
    return d;
  }

  /* Cota horizontal o vertical en cadena */
  function cadena(puntos, fijo, vertical, lado, rotulos) {
    let s = '';
    const v = vertical;
    s += v ? L(fijo, puntos[0], fijo, puntos[puntos.length - 1], 'cota') : L(puntos[0], fijo, puntos[puntos.length - 1], fijo, 'cota');
    puntos.forEach(p => {
      const [x, y] = v ? [fijo, p] : [p, fijo];
      s += L(x - .22, y + .22, x + .22, y - .22, 'tick');
      s += v ? L(fijo - .5, p, fijo + .5, p, 'cota') : L(p, fijo - .5, p, fijo + .5, 'cota');
    });
    for (let i = 1; i < puntos.length; i++) {
      const m = (puntos[i] + puntos[i - 1]) / 2;
      const txt = rotulos && rotulos[i - 1] ? rotulos[i - 1] : nf(puntos[i] - puntos[i - 1]);
      s += v ? T(fijo + (lado || -.45), m, txt, 'tc', -90) : T(m, fijo + (lado || -.45), txt, 'tc');
    }
    return s;
  }

  function camion(x, y, n) { /* culata en x, frente hacia +x */
    return `<g class="camion">` +
      R(x, y - 1.22, x + 5.9, y + 1.22, 'veh', 'rx="2"') +
      R(x + .12, y - 1.1, x + 5.78, y + 1.1, 'vehf') +
      R(x + 5.0, y - .8, x + 5.9, y + .8, 'vehf') +
      R(x + 6.05, y - 1.12, x + 8.2, y + 1.12, 'veh', 'rx="9"') +
      `<path d="M${u(x + 7.0)} ${u(y - .95)}Q${u(x + 7.75)} ${u(y)} ${u(x + 7.0)} ${u(y + .95)}L${u(x + 7.35)} ${u(y + .95)}Q${u(x + 8.05)} ${u(y)} ${u(x + 7.35)} ${u(y - .95)}Z" class="vehv"/>` +
      R(x + 6.9, y - 1.36, x + 7.15, y - 1.14, 'vehv') + R(x + 6.9, y + 1.14, x + 7.15, y + 1.36, 'vehv') +
      (n ? T(x + 2.7, y + .12, 'CAMIÓN ' + n, 'tmin') : '') + `</g>`;
  }
  const pallet = (x, y) => R(x - .5, y - .6, x + .5, y + .6, 'mob') + L(x - .5, y, x + .5, y, 'fino') + L(x, y - .6, x, y + .6, 'fino');
  const arbol = (x, y, r) => C(x, y, r, 'arbol') + C(x, y, r * .35, 'arbol2');
  function puertaHoja(x, y, w, ang, sentido) { /* puerta de abrir */
    const a = ang * Math.PI / 180, bx = x + w * Math.cos(a), by = y + w * Math.sin(a);
    const a2 = a + sentido * Math.PI / 2, cx = x + w * Math.cos(a2), cy = y + w * Math.sin(a2);
    return `<path d="M${u(cx)} ${u(cy)}L${u(x)} ${u(y)}" class="hoja"/><path d="M${u(bx)} ${u(by)}A${u(w)} ${u(w)} 0 0 ${sentido > 0 ? 1 : 0} ${u(cx)} ${u(cy)}" class="giro"/>`;
  }

  const zona = (id) => SECTORES.find(s => s.id === id);
  function zonaSVG(id) {
    const s = zona(id);
    return `<g class="zona" data-id="${id}" tabindex="0" role="button" aria-label="${s.nombre}" style="--c:var(${s.color})">` +
      `<polygon points="${poly(s.poli)}" class="zf"/>` + (s.poli2 ? `<polygon points="${poly(s.poli2)}" class="zf"/>` : '') + `</g>`;
  }

  function construir() {
    let s = `<defs>
      <pattern id="hMuro" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="muroBg"/><line x1="0" y1="0" x2="0" y2="6" class="muroRaya"/></pattern>
      <pattern id="hPir" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" class="pirBg"/><path d="M0 8L4 0L8 8" class="pirRaya"/></pattern>
      <pattern id="hPasto" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M8 14l2-6M11 14l3-5M32 36l2-6M35 36l3-5" class="pastoRaya"/></pattern>
      <pattern id="hHorm" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" class="juntaRaya"/></pattern>
      <pattern id="hPeligro" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" class="pelA"/><rect width="5" height="10" class="pelB"/></pattern>
      ${['f1', 'f2', 'f3', 'f4', 'ci', 'ce'].map(k => `<marker id="m-${k}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.1" markerHeight="3.1" orient="auto"><path d="M0 0L10 5L0 10Z" class="mk-${k}"/></marker>`).join('')}
    </defs>`;

    /* ---------- terreno ---------- */
    s += `<g id="terreno">` + R(-120, -100, 200, 160, 'pasto') + `<rect x="${u(-120)}" y="${u(-100)}" width="${u(320)}" height="${u(260)}" fill="url(#hPasto)"/>`;
    s += R(-4.2, -4.5, 46.25, 37.4, 'ripio', 'rx="10"');
    for (let y = -20; y <= 62; y += 2.6) s += arbol(70.2 + (y % 5.2 ? .5 : 0), y, 1.15) + arbol(73.4, y + 1.2, 1.15);
    for (let x = -14; x <= 67; x += 2.6) s += arbol(x, 60.2, 1.15);
    for (let y = -9; y <= 57; y += 2.6) s += arbol(-14.5, y, 1.15);
    for (let y = 24; y <= 43; y += 3.2) s += C(55.25, y, .7, 'mata');
    s += `</g>`;

    /* ---------- exterior ---------- */
    const { playon: p, apron: ap, egreso: e, ingreso: g, ramal: r, loop: lo } = M;
    const rin = lo.r - lo.w / 2, rout = lo.r + lo.w / 2;
    s += `<g id="exterior">`;
    s += `<path d="M${u(lo.cx - rout)} ${u(lo.cy)}A${u(rout)} ${u(rout)} 0 0 0 ${u(lo.cx + rout)} ${u(lo.cy)}L${u(lo.cx + rin)} ${u(lo.cy)}A${u(rin)} ${u(rin)} 0 0 1 ${u(lo.cx - rin)} ${u(lo.cy)}Z" class="asfalto"/>`;
    s += R(r.x0, p.y1 - .02, r.x1, lo.cy, 'asfalto') + R(g.x0, M.yNorte, g.x1, lo.cy, 'asfalto') + R(e.x0, M.yNorte, e.x1, 20.2, 'asfalto');
    s += R(ap.x0, ap.y0, ap.x1, ap.y1, 'asfalto');
    s += R(58.75, M.yNorte, 59.25, 20.2, 'cantero');
    s += L(g.x1 - .25, M.yNorte, g.x1 - .25, 46, 'via') + L(g.x0 + .25, M.yNorte, g.x0 + .25, 46, 'via') + L(e.x1 - .25, M.yNorte, e.x1 - .25, 20.2, 'via') + L(e.x0 + .25, M.yNorte, e.x0 + .25, -3, 'via');
    s += L(r.x1 - .25, 20.4, r.x1 - .25, 46, 'via') + L(r.x0 + .25, 36, r.x0 + .25, 46, 'via');
    s += zonaSVG('calle');
    s += R(p.x0, p.y0, p.x1, p.y1, 'hormigon') + `<rect x="${u(p.x0)}" y="${u(p.y0)}" width="${u(p.x1 - p.x0)}" height="${u(p.y1 - p.y0)}" fill="url(#hHorm)"/>`;
    s += zonaSVG('playon');
    [2.5, 6.5, 10.5, 14.5, 18.5].forEach(y => s += L(40.2, y, 49.6, y, 'linea'));
    M.portones.forEach((y, i) => {
      s += `<path d="M${u(41)} ${u(y - 1.5)}H${u(44.2)}q8 0 8 -5" class="guia"/><path d="M${u(41)} ${u(y + 1.5)}H${u(44.2)}q8 0 8 5" class="guia"/>`;
    });
    /* subestación */
    s += R(48, -13.5, 51.6, -10, 'equipo') + `<path d="M${u(49.9)} ${u(-13)}l-10 24h8l-6 20 18 -28h-9l6 -16z" class="rayo"/>` + T(49.8, -8.9, 'Subestación existente', 'tmin');
    /* peatonal */
    s += R(40.1, .5, 41.5, 1.9, 'escal'); for (let i = 1; i < 5; i++) s += L(40.1 + i * .28, .5, 40.1 + i * .28, 1.9, 'fino');
    for (let i = 0; i < 5; i++) s += R(41.8 + i * .9, .6, 42.3 + i * .9, 1.8, 'senda');
    s += `</g>`;

    /* ---------- capa planta baja ---------- */
    s += `<g id="capa-pb" class="capa">`;
    s += R(0, 0, 40, 26, 'piso');
    ['bal', 'carga', 'cam2', 'cam1', 'lavado', 'acc'].forEach(z => {
      if (z === 'lavado') s += R(4, 26, 40, 33, 'piso');
      s += zonaSVG(z);
    });
    /* rampa */
    s += R(M.rampa.x0, M.rampa.y0, M.rampa.x1, M.rampa.y1, 'rampa') + R(-2.2, 13.4, 0, 16.2, 'rampa');
    s += `<path d="M${u(-1.75)} ${u(25.4)}V${u(17)}m-5 8l5 -8 5 8" class="finoL"/>` + T(-2.65, 21, 'Rampa 9 %', 'tmin', -90);
    s += R(-2.2, 26, 4, 33, 'rampa');

    /* racks y cajones en cámaras */
    for (let x = .9; x < 18.4; x += 1.45) s += R(x, 24.75, x + 1.2, 25.75, 'mob');
    for (let x = 20.2; x < 38.9; x += 1.45) s += R(x, 24.75, x + 1.2, 25.75, 'mob');
    for (let x = 13.2; x < 18.6; x += 1.45) s += R(x, 20.55, x + 1.2, 21.5, 'mob');
    for (let x = 32.2; x < 38.9; x += 1.45) s += R(x, 20.55, x + 1.2, 21.5, 'mob');
    [[4, 25.1], [15, 25.1], [25, 25.1], [35, 25.1]].forEach(([x]) => s += `<g class="evap">${R(x, 25.45, x + 2, 25.85, 'equipo')}${C(x + .5, 25.65, .14, 'fan')}${C(x + 1, 25.65, .14, 'fan')}${C(x + 1.5, 25.65, .14, 'fan')}</g>`);

    /* balanzas */
    M.balanzas.forEach(([x, y], i) => {
      s += `<polygon points="${poly([[x, y - 2.1], [x + 2.3, y], [x, y + 2.1], [x - 2.3, y]])}" class="balFondo"/>`;
      s += R(x - .75, y - .75, x + .75, y + .75, 'balanza', 'rx="2"') + C(x, y, .45, 'balDisco') + L(x, y, x + .25, y - .28, 'hoja');
      s += R(x - .9, y + 1.0 - .02, x + .9, y + 1.35, 'mob');
      s += T(x, y - 2.55, 'BALANZA ' + (i + 1), 'tz2');
    });
    /* zorras */
    M.zorras.forEach(([x, y]) => {
      s += pallet(x, y) + L(x + .55, y - .25, x + 1.0, y - .25, 'hoja') + L(x + .55, y + .25, x + 1.0, y + .25, 'hoja') + L(x + 1, y - .25, x + 1, y + .25, 'hoja') + L(x + 1, y, x + 1.7, y - .5, 'hoja');
    });
    /* mesas de armado y acopio limpio */
    for (let x = 25.6; x < 30.5; x += 2.6) s += R(x, 8.5, x + 2, 9.5, 'mob') + R(x, 14.3, x + 2, 15.3, 'mob');
    for (let y = 7.6; y < 13; y += 1.3) s += pallet(2.2, y + .2) + pallet(3.6, y + .2);
    s += T(5.1, 10.4, 'Cajones limpios', 'tmin', -90);
    /* pulmón por portón */
    M.portones.forEach(y => {
      s += R(33, y - 1.65, 35.6, y + 1.65, 'pulmon');
      s += pallet(33.7, y - .8) + pallet(33.7, y + .8) + pallet(34.9, y - .8) + pallet(34.9, y + .8);
    });
    s += L(32.5, 0.2, 32.5, 20.1, 'divisor');
    s += `<path d="M${u(38.9)} ${u(.6)}V${u(19.8)}" class="canaleta"/><path d="M${u(6)} ${u(18.9)}H${u(31.6)}" class="canaleta"/><path d="M${u(5)} ${u(32.2)}H${u(33)}" class="canaleta"/>`;

    /* escalera */
    const es = M.escalera;

  /* ---------- montaje ---------- */
  function construir() {

    materiales();
    ['base', 'caps', 'sup', 'techo', 'ofi', 'ofiT', 'alero', 'ting', 'flujo', 'circ', 'pick'].forEach(k => { G[k] = new T3.Group(); escena.add(G[k]); }); G.caps.visible = false;

    /* cielo y ambiente */
    const cielo = new T3.Mesh(new T3.SphereGeometry(600, 32, 20), new T3.ShaderMaterial({ side: T3.BackSide, depthWrite: false, fog: false, toneMapped: false,

      fragmentShader: 'varying vec3 d;void main(){float h=clamp(normalize(d).y,0.,1.);vec3 a=vec3(.83,.905,.945),b=vec3(.49,.71,.88),c=vec3(.20,.45,.72);vec3 k=mix(mix(a,b,smoothstep(0.,.22,h)),c,smoothstep(.18,.85,h));float s=pow(max(dot(normalize(d),normalize(vec3(.62,.62,.48))),0.),220.);gl_FragColor=vec4(k+s*.5,1.);}' }));

    const amb = new T3.Scene(); const ds = new T3.Mesh(new T3.SphereGeometry(50, 24, 16), new T3.ShaderMaterial({ side: T3.BackSide, vertexShader: 'varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}', fragmentShader: 'varying vec3 d;void main(){float h=normalize(d).y;vec3 k=h>0.?mix(vec3(.85,.9,.95),vec3(.35,.58,.85),pow(h,.6)):vec3(.34,.34,.29);gl_FragColor=vec4(k,1.);}' })); amb.add(ds);

    escena.add(new T3.HemisphereLight('#dcebf7', '#7d7a64', .16));
    const sol = new T3.DirectionalLight('#fff0d4', 2.75); sol.position.set(58, 62, 46); sol.target.position.set(6, 0, 4); sol.castShadow = true;
    sol.shadow.mapSize.setScalar(mob ? 2048 : 4096); Object.assign(sol.shadow.camera, { left: -62, right: 62, top: 58, bottom: -58, near: 5, far: 200 }); sol.shadow.bias = -.0003; sol.shadow.normalBias = .05; sol.shadow.radius = 3;

    exterior(); nave(); cartelFachada(); oficinas(); alero(); tinglado(); alamos();
    M.portones.forEach(y => { const c = camion3d(); c.position.set(40.5 - OX, .06, y - OZ); G.base.add(c); });
    fusionar(); volcarCajones(); flujos(); zonas(); controles();

    /* camión en recorrido */
    movil = camion3d(); G.base.add(movil);
    const ruta = [...redondear([[61.75, -60], ...RUTA_INGRESO.slice(1, -1), [51.4, 10], [52.2, 4], [56.4, -4], [56.4, -60]], 3)];

    rend.domElement.addEventListener('pointerup', e => {

      const ext = ['ofi', 'lavado', 'porton', 'playon', 'calle', 'muelles'];
      const cand = zonasPick.filter(o => (corte || ext.includes(o.userData.id)) && (o.userData.id !== 'ofi' || verOfi));

    listo = true;
  }
  /* une mallas del mismo material para bajar las llamadas de dibujo */
  function fusionar() {
    escena.updateMatrixWorld(true);
    ['base', 'caps', 'sup', 'techo', 'ofi', 'ofiT', 'alero', 'ting'].forEach(k => {
      const grupos = new Map(), fuera = [];
      G[k].traverse(o => {
        if (!o.isMesh || o.isInstancedMesh || Array.isArray(o.material) || !o.geometry.attributes.uv) return;

        if (!grupos.has(id)) grupos.set(id, []); grupos.get(id).push(o);
      });

        if (L.length < 2) return;
        const P = [], N = [], U = [], v = new T3.Vector3(), n3 = new T3.Matrix3();

          for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld); P.push(v.x, v.y, v.z); v.fromBufferAttribute(n, i).applyMatrix3(n3).normalize(); N.push(v.x, v.y, v.z); U.push(t.getX(i), t.getY(i)); }
          fuera.push(o);
        });
        const g = new T3.BufferGeometry(); g.setAttribute('position', new T3.Float32BufferAttribute(P, 3)); g.setAttribute('normal', new T3.Float32BufferAttribute(N, 3)); g.setAttribute('uv', new T3.Float32BufferAttribute(U, 2));
        const m = new T3.Mesh(g, L[0].material); m.castShadow = L[0].castShadow; m.receiveShadow = L[0].receiveShadow; G[k].add(m);
      });
      fuera.forEach(o => o.parent.remove(o));
    });
  }
  function medir() {
    const w = cont.clientWidth, h = cont.clientHeight; if (!w || !h || !rend) return;
    rend.setSize(w, h); camara.aspect = w / h; fovBase = w / h < 1 ? 52 : 42; camara.fov = fovObj || fovBase; camara.updateProjectionMatrix();
  }
  const suave = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  let fovBase = 42, ult = 0; const v3 = { a: null };

    G.ofi.visible = verOfi; if (!verOfi) G.ofiT.visible = G.ofiT.visible && corte && kk < 1 && kk > 0;
    if (!quieto) {
      cintas.forEach(c => c.offset.y -= dt * 1.1);
      const s = ((t / 1000 * 4.2) % (largo + 30)) / largo;
      if (s < 1) { const p = curva.getPointAt(s), q = curva.getPointAt(Math.min(1, s + 5.2 / largo)); movil.visible = true; movil.position.copy(p); const d = q.sub(p); if (d.lengthSq() > .01) movil.rotation.y = Math.atan2(-d.z, d.x); movil.translateX(-4); movil.visible = s < .985 && s > .005; }

    } else if (!movil.userData.fijo) { movil.userData.fijo = 1; movil.position.set(61.75 - OX, .06, 20 - OZ); movil.rotation.y = -Math.PI / 2; }

  }
  function rotulos() {

    const ext = dentro ? ['cam1', 'cam2', 'bal', 'carga', 'playon', 'calle', 'porton'] : ['ofi', 'playon', 'calle', 'porton', 'lavado', 'muelles'], usados = [];
    etiquetas.forEach(e => {
      let on = verLbl && (corte ? (e.id !== 'ofi' || verOfi) : ext.includes(e.id));
      if (on) { v.copy(e.v); if (!corte && e.id === 'muelles') v.set(47 - OX, 5.3, 1.6 - OZ); v.project(camara); on = v.z < 1 && Math.abs(v.x) < 1.02 && v.y < .9 && v.y > -.93; }
      if (!on) { e.el.style.display = 'none'; return; }
      e.el.style.display = '';
      if (!e.w) { e.w = e.el.offsetWidth; e.h = e.el.offsetHeight; }
      const x = (v.x + 1) / 2 * w; let y = (1 - v.y) / 2 * h - 14;

/* ============================================================
   INTERFAZ: pestañas, capas y ficha de sector
   ============================================================ */
const App = (() => {
  const $ = id => document.getElementById(id);
  const panel = $('panel');
  const num = n => n.toLocaleString('es-AR', { maximumFractionDigits: 1 });
  const sup = s => s.area ? num(s.area) + ' m²' : '';
  let actual = null;
  const estado = {};

  function resumen() {
    const li = SECTORES.map(s => `<li><button data-id="${s.id}" style="--c:var(${s.color})"><i></i><span>${s.nombre}</span><small>${sup(s)}</small></button></li>`).join('');

      <h3>De dónde salen las medidas</h3>
      <p class="nota">Las proporciones son las del Excalidraw, a 3,65 cm por unidad, que da portones cada 4,00 m. La fachada actual mide unos 12,50 m según las fotos, usando a las personas como escala. No alcanza para cuatro muelles más la cámara, así que el proyecto la extiende 13,50 m hacia el lado opuesto al tinglado. Hay que relevar el predio antes de avanzar.</p>` + agua;
  }

    panel.innerHTML = `<div class="ficha" style="--c:var(${s.color})">
      <button class="volver" id="volver">Ver todos los sectores</button>
      <p class="tag"><i></i>${pl}</p><h2>${s.nombre}</h2><p>${s.resumen}</p>
      <dl class="datos"><dt>Medidas</dt><dd>${s.medidas}</dd>${s.area ? `<dt>Superficie</dt><dd>${s.id === 'calle' ? '≈ ' : ''}${sup(s)}</dd>` : ''}<dt>Estado</dt><dd>${s.estado}</dd></dl>
      <h3>Detalles constructivos</h3><ul>${s.obra.map(x => `<li>${x}</li>`).join('')}</ul>
      <h3>Recomendaciones operativas</h3><ul>${s.uso.map(x => `<li>${x}</li>`).join('')}</ul></div>` + agua;
    $('volver').onclick = () => elegir(null);

  function elegir(id) {

    estado[id] = on;
    const b = $('capa-btn-' + id); if (b) b.setAttribute('aria-pressed', on);

  }

    $('capas').innerHTML = CAPAS.map(c => `<button id="capa-btn-${c.id}" aria-pressed="${c.on}">${c.nombre}</button>`).join('');
    CAPAS.forEach(c => { $('capa-btn-' + c.id).onclick = () => ponerCapa(c.id, !estado[c.id]); ponerCapa(c.id, c.on); });

App.iniciar();
