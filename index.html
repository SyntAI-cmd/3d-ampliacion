<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Diseñador de Planta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Source+Sans+3:wght@400..700&amp;display=swap">
<style>
/* Mesa de dibujo editable: paleta de elementos a la izquierda, lámina al centro, ficha del elemento a la derecha */
:root{
  --bg:#ffffff; --hoja:#fbfbfa; --panel:#ffffff; --tinta:#1a1a1a; --tinta2:#5e5b58; --linea:#e0dedb; --suave:#f7f3eb; --fuera:#eeece8;
  --rojo:#b11e22; --sobreRojo:#ffffff; --velo:#fbe9e9; --sel:#d4161c;
  --muro:#1a1a1a; --piso:#ffffff; --mob:#f1f0ee; --fino:#96918c;
  --pasto:#e6ead9; --pastoRaya:#bfc9a8; --arbol:#b3c596; --arbol2:#86a067; --ripio:#efe9dc;
  --asfalto:#c8c6c3; --hormigon:#e6e6e6; --junta:#d0cecb; --via:#ffffff;
  --veh:#ffffff; --vidrio:#8cc3dc; --guia:#e0a500; --casco:#ffffff;
  --grilla:#d9d6d1; --grilla2:#c4c0ba;
  --z-frio:#2f74a8; --z-bal:#e8912d; --z-carga:#2e8b4f; --z-ofi:#b11e22; --z-lav:#128a94; --z-acc:#8448a0; --z-play:#85807c; --z-calle:#4d4a48;
  --f1:#1f6ea6; --f2:#bf6a06; --f3:#22793f; --f4:#0c7a84; --ci:#b11e22; --ce:#5b3fa0;
  --display:"DM Serif Display",Georgia,serif; --texto:"Source Sans 3","Source Sans Pro","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212; --hoja:#191919; --panel:#1a1a1a; --tinta:#f4f2ee; --tinta2:#b3aeaa; --linea:#383635; --suave:#262423; --fuera:#141414;
  --rojo:#d8383d; --sobreRojo:#ffffff; --velo:#3a1c1d; --sel:#ff5a5f;
  --muro:#ece9e4; --piso:#222120; --mob:#2e2c2b; --fino:#77726e;
  --pasto:#1c2119; --pastoRaya:#333c2b; --arbol:#33432b; --arbol2:#4e6640; --ripio:#27251f;
  --asfalto:#34322f; --hormigon:#2c2b2a; --junta:#3c3a38; --via:#a5a09b;
  --veh:#3f3d3b; --vidrio:#4f9dbf; --guia:#e9b93a; --casco:#e8e6e2;
  --grilla:#2a2928; --grilla2:#383634;
  --z-frio:#5aa5dc; --z-bal:#f0a64e; --z-carga:#57bd7c; --z-ofi:#ee6a6e; --z-lav:#38b6c0; --z-acc:#b483d0; --z-play:#9b9691; --z-calle:#8c8782;
  --f1:#6fb6ee; --f2:#f2b45c; --f3:#68d08e; --f4:#4fccd6; --ci:#ff7a7e; --ce:#b9a2f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --hoja:#191919; --panel:#1a1a1a; --tinta:#f4f2ee; --tinta2:#b3aeaa; --linea:#383635; --suave:#262423; --fuera:#141414;
  --rojo:#d8383d; --sobreRojo:#ffffff; --velo:#3a1c1d; --sel:#ff5a5f;
  --muro:#ece9e4; --piso:#222120; --mob:#2e2c2b; --fino:#77726e;
  --pasto:#1c2119; --pastoRaya:#333c2b; --arbol:#33432b; --arbol2:#4e6640; --ripio:#27251f;
  --asfalto:#34322f; --hormigon:#2c2b2a; --junta:#3c3a38; --via:#a5a09b;
  --veh:#3f3d3b; --vidrio:#4f9dbf; --guia:#e9b93a; --casco:#e8e6e2;
  --grilla:#2a2928; --grilla2:#383634;
  --z-frio:#5aa5dc; --z-bal:#f0a64e; --z-carga:#57bd7c; --z-ofi:#ee6a6e; --z-lav:#38b6c0; --z-acc:#b483d0; --z-play:#9b9691; --z-calle:#8c8782;
  --f1:#6fb6ee; --f2:#f2b45c; --f3:#68d08e; --f4:#4fccd6; --ci:#ff7a7e; --ce:#b9a2f2; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tinta);font:15px/1.45 var(--texto);display:flex;flex-direction:column}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rojo);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- cabecera ---------- */
.top{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;background:#1a1a1a;color:#fff;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top::after{content:"";position:absolute;right:0;top:0;bottom:0;width:260px;background:#b11e22;clip-path:polygon(64% 0,100% 0,100% 100%,0 100%,14% 93%,28% 82%,40% 66%,50% 46%,58% 22%);pointer-events:none;opacity:.9}
.top>*{position:relative;z-index:1}
.marca{display:flex;align-items:center;gap:14px;min-width:0}
h1{margin:0;line-height:0;flex:none}
h1 svg{height:40px;width:auto;display:block}
.marca p{margin:0;padding-left:14px;border-left:1px solid #55514e;display:flex;flex-direction:column;gap:1px}
.marca b{font:400 18px/1.1 var(--display)}
.marca span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#c9c5c1;line-height:1.3}
.nombre{background:transparent;border:1px solid transparent;border-bottom-color:#55514e;color:#fff;padding:5px 8px;border-radius:6px 6px 0 0;width:min(260px,100%);font-weight:600}
.nombre:hover,.nombre:focus{border-color:#77726e;background:#262423}
.tabs{display:flex;gap:4px}
.tabs button,.acc button{border:1px solid #55514e;background:#1a1a1a;padding:6px 13px;border-radius:8px;font-weight:600;color:#fff;line-height:1.25}
.tabs button:hover,.acc button:hover{border-color:#fff}
.tabs button[aria-selected="true"]{background:#b11e22;border-color:#b11e22}
.acc{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.acc button.prim{background:#fff;color:#1a1a1a;border-color:#fff}
.acc button:disabled{opacity:.4;cursor:default;border-color:#55514e}
.top button:focus-visible,.nombre:focus-visible{outline-color:#fff}
.estado{font-size:12.5px;color:#c9c5c1;white-space:nowrap}

/* ---------- área de trabajo ---------- */
.app{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr) 316px;grid-template-rows:minmax(0,1fr)}
.paleta{grid-column:1;grid-row:1;background:var(--panel);border-right:1px solid var(--linea);overflow-y:auto;min-height:0;padding:12px 10px 20px max(10px,env(safe-area-inset-left,0px))}
.escena{grid-column:2;grid-row:1;position:relative;min-height:0;min-width:0;background:var(--fuera);overflow:hidden}
.inspector{grid-column:3;grid-row:1;background:var(--panel);border-left:1px solid var(--linea);overflow-y:auto;min-height:0;padding:16px 16px 26px;padding-right:max(16px,env(safe-area-inset-right,0px))}

/* paleta */
.buscar{width:100%;border:1px solid var(--linea);background:var(--hoja);border-radius:8px;padding:7px 10px;margin-bottom:6px}
.cat{border-top:1px solid var(--linea)}
.cat summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:9px 4px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2)}
.cat summary::-webkit-details-marker{display:none}
.cat summary::after{content:"+";font-size:17px;font-weight:500}
.cat[open] summary::after{content:"−"}
.cat summary:hover{color:var(--tinta)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 0 10px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--linea);background:var(--hoja);border-radius:8px;padding:7px 4px 6px;font-size:12.5px;line-height:1.15;text-align:center;font-weight:500;touch-action:manipulation}
.item:hover{border-color:var(--rojo);background:var(--velo)}
.item svg{width:100%;height:34px;display:block;pointer-events:none}
.pista{font-size:12.5px;color:var(--tinta2);margin:4px 2px 10px;line-height:1.4}

/* lámina */
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
#svg.pan{cursor:grabbing}
#svg *{vector-effect:non-scaling-stroke}
#svg [data-id]{cursor:move}
#svg [data-id].fijo{cursor:pointer}
#svg [data-h]{cursor:nwse-resize}
#svg [data-h="rot"]{cursor:crosshair}
.hud{position:absolute;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;align-items:center}
.hud>*{pointer-events:auto}
.hud button,.hud .seg{border:1px solid var(--linea);background:var(--panel);border-radius:8px;padding:5px 11px;font-weight:600;font-size:14px;line-height:1.3}
.hud button:hover{border-color:var(--tinta2)}
.hud button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--panel)}
.hud-sup{top:10px;left:10px;right:10px}
.seg{display:flex;padding:2px!important;gap:2px}
.seg button{border:0!important;padding:3px 10px!important;border-radius:6px!important;background:transparent}
.seg button[aria-pressed="true"]{background:var(--rojo)!important;color:var(--sobreRojo)!important}
.hud-zoom{right:10px;bottom:10px}
.hud-zoom button{min-width:34px}
.escala{position:absolute;left:12px;bottom:12px;pointer-events:none;font-size:12px;font-weight:600;color:var(--tinta2);font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 8px 5px;border-radius:6px}
.escala i{display:block;height:6px;border:2px solid var(--tinta);border-top:0;margin-top:2px}
.coords{position:absolute;left:12px;bottom:52px;pointer-events:none;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--tinta);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 8px;border-radius:6px}
.coords:empty{display:none}
.norte{position:absolute;right:14px;top:54px;width:34px;height:46px;pointer-events:none}
.toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:var(--tinta);color:var(--panel);padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.ver{opacity:1}
#gl{position:absolute;inset:0}
#gl canvas{display:block;touch-action:none}
.aviso{position:absolute;inset:0;margin:0;display:grid;place-items:center;color:var(--tinta2);padding:24px;text-align:center;background:var(--hoja)}

/* inspector */
.inspector h2{font:400 26px/1.1 var(--display);margin:0;text-wrap:balance}
.inspector h2::before{content:"";display:block;width:30px;height:5px;border-radius:3px;background:var(--rojo);margin-bottom:10px}
.inspector h3{font:700 12.5px/1.2 var(--texto);letter-spacing:.1em;text-transform:uppercase;margin:20px 0 8px;color:var(--rojo)}
.tag{display:flex;gap:8px;align-items:center;color:var(--tinta2);font-size:13px;margin:6px 0 0}
.tag i{width:13px;height:13px;border-radius:3px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 40%,transparent);display:block}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.campo{display:flex;flex-direction:column;gap:3px;min-width:0}
.campo.ancho{grid-column:1/-1}
.campo label,.campo>span{font-size:12.5px;color:var(--tinta2);font-weight:500}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid var(--linea);background:var(--hoja);border-radius:7px;padding:6px 8px;min-width:0}
.campo input[type=number]{font-variant-numeric:tabular-nums}
.campo textarea{resize:vertical;min-height:58px;line-height:1.35}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}
.chk input{width:17px;height:17px;accent-color:var(--rojo)}
.botones{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--linea);background:var(--hoja);border-radius:8px;padding:6px 11px;font-weight:600;font-size:14px;line-height:1.25}
.btn:hover{border-color:var(--tinta2)}
.btn.peligro{color:var(--rojo)}
.btn.peligro:hover{border-color:var(--rojo);background:var(--velo)}
.btn.prim{background:var(--rojo);border-color:var(--rojo);color:var(--sobreRojo)}
.muestras{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.muestra{width:24px;height:24px;border-radius:6px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--linea);background:var(--c);padding:0}
.muestra[aria-pressed="true"]{box-shadow:0 0 0 2px var(--tinta)}
.muestras input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--linea);border-radius:6px;background:none}
.datos{background:var(--suave);border-radius:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:12px 0 0;padding:10px 12px;font-variant-numeric:tabular-nums;font-size:14px}
.datos dt{color:var(--tinta2)} .datos dd{margin:0;font-weight:600;text-align:right}
.ampliar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.ampliar .btn{padding:6px 4px;font-size:13px}
.ampliar .c{grid-column:2}
.lista{list-style:none;margin:6px 0 0;padding:0;max-height:300px;overflow-y:auto;border:1px solid var(--linea);border-radius:8px}
.lista li+li{border-top:1px solid var(--linea)}
.lista button{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:6px 9px;font-size:14px}
.lista button:hover{background:var(--velo)}
.lista i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.lista span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista small{color:var(--tinta2);font-size:12px;font-variant-numeric:tabular-nums}
.nota{font-size:13px;color:var(--tinta2);line-height:1.45}
.atajos{font-size:13px;color:var(--tinta2);display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
.atajos dt{font-weight:700;color:var(--tinta)} .atajos dd{margin:0}
kbd{font:600 12px var(--texto);border:1px solid var(--linea);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--hoja)}

/* diálogo */
dialog{border:0;border-radius:14px;padding:0;background:var(--panel);color:var(--tinta);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,18,17,.55)}
.dlg{padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font:400 26px/1.1 var(--display);margin:0}
.dlg p{margin:0}
.opcion{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--linea);border-radius:10px;padding:12px 14px;background:var(--hoja)}
.opcion b{font-size:16px}
.opcion small{grid-column:1;color:var(--tinta2);font-size:13px}
.opcion .btn{grid-row:1/3;grid-column:2}
.guardados{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
.guardados li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;border:1px solid var(--linea);border-radius:9px;padding:8px 10px;background:var(--hoja)}
.guardados b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guardados small{color:var(--tinta2);font-size:12.5px}
.dlg textarea{width:100%;min-height:120px;border:1px solid var(--linea);border-radius:8px;background:var(--hoja);padding:8px;font:12.5px/1.35 ui-monospace,Menlo,monospace}
.dlg .pie{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dims{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.dims .campo{width:110px}

@media (max-width:900px){
  html,body{height:auto;min-height:100%}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto}
  .escena{grid-column:1;grid-row:1;height:62vh;min-height:420px}
  .paleta{grid-column:1;grid-row:2;border-right:0;border-top:1px solid var(--linea);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:visible}
  .items{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .inspector{grid-column:1;grid-row:3;border-left:0;border-top:1px solid var(--linea);padding-left:max(16px,env(safe-area-inset-left,0px));overflow:visible}
  .top::after{width:120px}
  .marca p{display:none}
  .top{gap:8px 10px}
  h1 svg{height:32px}
  .nombre{flex:1;width:auto;min-width:140px}
  .tabs button,.acc button{padding:5px 10px;font-size:14px}
  .acc{margin-left:0}
  .estado{display:none}
  .hud button,.hud .seg{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<header class="top">
  <div class="marca">
    <h1 id="logo" aria-label="El Pollito Casero"></h1>
    <p><b>Diseñador de planta</b><span>Planta de faena · editable</span></p>
  </div>
  <input id="nombreDiseno" class="nombre" aria-label="Nombre del diseño" value="Ampliación de planta">
  <div class="tabs" role="tablist" aria-label="Vistas">
    <button role="tab" id="tab-plano" aria-selected="true">Plano 2D</button>
    <button role="tab" id="tab-3d" aria-selected="false" tabindex="-1">Vista 3D</button>
  </div>
  <div class="acc">
    <button id="b-nuevo">Nuevo</button>
    <button id="b-abrir">Abrir</button>
    <button id="b-guardar" class="prim">Guardar</button>
    <button id="b-deshacer" aria-label="Deshacer" title="Deshacer (Ctrl+Z)">↶</button>
    <button id="b-rehacer" aria-label="Rehacer" title="Rehacer (Ctrl+Y)">↷</button>
    <button id="b-exportar">Exportar</button>
  </div>
  <span class="estado" id="estado">Sin guardar</span>
</header>

<main class="app">
  <aside class="paleta" aria-label="Elementos para agregar">
    <input class="buscar" id="buscar" type="search" placeholder="Buscar elemento…" aria-label="Buscar elemento">
    <p class="pista">Tocá un elemento para ponerlo en el centro, o arrastralo al plano.</p>
    <div id="cats"></div>
  </aside>

  <section class="escena" id="vista-plano" aria-label="Plano editable">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="Plano en planta, editable"></svg>
    <div class="hud hud-sup">
      <div class="seg" role="group" aria-label="Nivel visible" id="niveles">
        <button data-n="todo" aria-pressed="true">Todo</button>
        <button data-n="PB" aria-pressed="false">Planta baja</button>
        <button data-n="PA" aria-pressed="false">Planta alta</button>
      </div>
      <button id="t-grilla" aria-pressed="true">Grilla</button>
      <button id="t-iman" aria-pressed="true" title="Ajustar a 0,5 m y a 15°">Imán</button>
    </div>
    <svg class="norte" viewBox="0 0 34 46" aria-hidden="true"><path d="M17 2L27 30L17 24L7 30Z" fill="var(--tinta)"/><text x="17" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="var(--tinta)" font-family="Source Sans 3, sans-serif">N</text></svg>
    <div class="coords" id="coords"></div>
    <div class="escala" id="escala"></div>
    <div class="hud hud-zoom">
      <button id="z-mas" aria-label="Acercar">+</button><button id="z-menos" aria-label="Alejar">−</button><button id="z-todo">Encuadrar</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </section>

  <section class="escena" id="vista-3d" aria-label="Vista 3D" hidden>
    <div id="gl"></div>
    <div class="hud hud-zoom">
      <button id="v-persp">Perspectiva</button><button id="v-arriba">Desde arriba</button><button id="v-frente">Desde el playón</button>
    </div>
    <p class="aviso" id="aviso3d">Cargando modelo…</p>
  </section>

  <aside class="inspector" id="insp" aria-live="polite"></aside>
</main>

<dialog id="dlg"></dialog>

const MUESTRAS = ['--z-frio', '--z-bal', '--z-carga', '--z-ofi', '--z-lav', '--z-acc', '--z-play', '--f2', '--guia', '--asfalto', '--hormigon', '--arbol'];
const NPT_PA = 5.6; /* nivel de piso de la planta alta, en metros */

/* ============================================================
   Dibujo 2D de cada tipo, en coordenadas locales (metros),
   centrado en 0,0. c = color ya resuelto.
   ============================================================ */
const D = (() => {
  const R = (x, y, w, h, st, ex = '') => `<rect x="${f3(x)}" y="${f3(y)}" width="${f3(Math.max(w, 0))}" height="${f3(Math.max(h, 0))}" style="${st}" ${ex}/>`;
  const RC = (w, h, st, ex) => R(-w / 2, -h / 2, w, h, st, ex);
  const Ln = (x1, y1, x2, y2, st) => `<line x1="${f3(x1)}" y1="${f3(y1)}" x2="${f3(x2)}" y2="${f3(y2)}" style="${st}"/>`;
  const Ci = (x, y, r, st) => `<circle cx="${f3(x)}" cy="${f3(y)}" r="${f3(r)}" style="${st}"/>`;
  const El = (x, y, rx, ry, st) => `<ellipse cx="${f3(x)}" cy="${f3(y)}" rx="${f3(rx)}" ry="${f3(ry)}" style="${st}"/>`;
  const P = (d, st) => `<path d="${d}" style="${st}"/>`;
  const MURO = 'stroke:var(--muro)';
  const FINO = 'stroke:var(--fino);stroke-width:1;fill:none';
  const tinte = (w, h, c, op, sw = 1.3, ex = '', trazo = 'var(--muro)') =>
    RC(w, h, 'fill:var(--piso)', ex) + RC(w, h, `fill:${c};fill-opacity:${op};stroke:${trazo};stroke-width:${sw}`, ex);
  const ventilador = (x, y, r) => Ci(x, y, r, 'fill:none;stroke:var(--muro);stroke-width:1') + Ln(x - r * .7, y - r * .7, x + r * .7, y + r * .7, FINO) + Ln(x - r * .7, y + r * .7, x + r * .7, y - r * .7, FINO);
  const rayo = (x, y, s) => P(`M${f3(x + .15 * s)} ${f3(y - .5 * s)}L${f3(x - .25 * s)} ${f3(y + .05 * s)}H${f3(x + .02 * s)}L${f3(x - .12 * s)} ${f3(y + .5 * s)}L${f3(x + .28 * s)} ${f3(y - .08 * s)}H${f3(x + .02 * s)}Z`, 'fill:var(--guia);stroke:var(--muro);stroke-width:.8');
  const ventanas = (w, h) => RC(Math.max(w - .36, 0), Math.max(h - .36, 0), 'fill:none;stroke:var(--vidrio);stroke-width:2');
  const ruedasDe = (x0, x1, y, paso) => { let s = ''; for (let x = x0; x <= x1 + 1e-6; x += paso) s += R(x - .25, y - .1, .5, .2, 'fill:var(--muro)'); return s; };

  const d = {
    sala: (w, h, c) => tinte(w, h, c, .16, 2.6),
    camara: (w, h, c) => {
      let s = tinte(w, h, c, .2, 2.2, '', c) + RC(Math.max(w - .5, 0), Math.max(h - .5, 0), `fill:none;stroke:${c};stroke-width:1`);
      if (Math.min(w, h) > 2.2) {
        const x = -w / 2 + 1, y = -h / 2 + 1, r = .45;
        for (let a = 0; a < 3; a++) { const t = a * Math.PI / 3; s += Ln(x - r * Math.cos(t), y - r * Math.sin(t), x + r * Math.cos(t), y + r * Math.sin(t), `stroke:${c};stroke-width:1.6`); }
      }
      return s;
    },
    oficina: (w, h, c) => tinte(w, h, c, .14, 2.6) + ventanas(w, h),
    garita: (w, h, c) => tinte(w, h, c, .2, 2.2) + ventanas(w, h),
    vestuario: (w, h, c) => {
      let s = tinte(w, h, c, .16, 2.6); const n = clamp(Math.floor((w - .6) / 1.1), 0, 8);
      for (let i = 0; i < n; i++) s += El(-w / 2 + .9 + i * 1.1, -h / 2 + .55, .22, .3, 'fill:var(--piso);stroke:var(--muro);stroke-width:1');
      return s;
    },
    sala_maq: (w, h, c) => { const r = Math.min(w, h) * .16; return tinte(w, h, c, .2, 2.6) + ventilador(-w / 4, h / 5, r) + ventilador(w / 4, h / 5, r); },
    tinglado: (w, h, c) => R(-w / 2, -h / 2, w, h, `fill:${c};fill-opacity:.08;stroke:var(--tinta2);stroke-width:1.3;stroke-dasharray:8 5`) +
      Ln(-w / 2, -h / 2, w / 2, h / 2, 'stroke:var(--fino);stroke-width:.8;stroke-dasharray:3 6') + Ln(-w / 2, h / 2, w / 2, -h / 2, 'stroke:var(--fino);stroke-width:.8;stroke-dasharray:3 6'),
    muro: (w, h, c) => RC(w, h, `fill:${c}`),
    columna: (w, h, c) => RC(w, h, `fill:${c}`),
    puerta: (w, h) => RC(w, h, 'fill:var(--piso)') + Ln(-w / 2, 0, -w / 2, -w, `${MURO};stroke-width:1.6`) +
      P(`M${f3(-w / 2)} ${f3(-w)}A${f3(w)} ${f3(w)} 0 0 1 ${f3(w / 2)} 0`, 'fill:none;stroke:var(--fino);stroke-width:1'),
    porton: (w, h, c) => RC(w, h, 'fill:var(--piso)') + RC(w, h, `fill:${c};fill-opacity:.55;${MURO};stroke-width:1.4`) + Ln(-w / 2, 0, w / 2, 0, 'stroke:var(--muro);stroke-width:1;stroke-dasharray:4 3'),
    escalera: (w, h) => {
      let s = RC(w, h, `fill:var(--mob);${MURO};stroke-width:1.3`);
      for (let x = -w / 2 + .28; x < w / 2 - .05; x += .28) s += Ln(x, -h / 2, x, h / 2, FINO);
      s += Ln(-w / 2 + .2, 0, w / 2 - .25, 0, `${MURO};stroke-width:1.3`) + P(`M${f3(w / 2 - .55)} ${f3(-.22)}L${f3(w / 2 - .2)} 0L${f3(w / 2 - .55)} ${f3(.22)}`, `fill:none;${MURO};stroke-width:1.3`);
      return s;
    },
    rampa: (w, h) => {
      let s = RC(w, h, 'fill:var(--hormigon);stroke:var(--fino);stroke-width:1');
      for (let x = -w / 2 + .7; x < w / 2; x += .8) s += P(`M${f3(x - .3)} ${f3(-h / 3)}L${f3(x)} 0L${f3(x - .3)} ${f3(h / 3)}`, 'fill:none;stroke:var(--tinta2);stroke-width:1');
      return s;
    },

    jaulas: (w, h, c) => {
      let s = tinte(w, h, c, .22);

      for (let y = -h / 2 + .8; y < h / 2; y += .8) s += Ln(-w / 2, y, w / 2, y, FINO);

    },
    noria: (w, h, c) => {
      let s = Ln(-w / 2, 0, w / 2, 0, `${MURO};stroke-width:2.6`);
      for (let x = -w / 2 + .3; x < w / 2; x += .6) s += Ci(x, 0, Math.min(.1, h / 4), `fill:${c}`);
      return s;
    },
    aturdidor: (w, h, c) => tinte(w, h, c, .28, 1.3, 'rx="0.12"') + rayo(0, 0, Math.min(w, h) * .8),
    desangrado: (w, h, c) => tinte(w, h, c, .22) + RC(Math.max(w - .4, 0), Math.max(h - .4, 0), FINO) + Ln(-w / 2 + .3, 0, w / 2 - .3, 0, 'stroke:var(--muro);stroke-width:1;stroke-dasharray:6 4'),
    escaldador: (w, h, c) => {
      let s = tinte(w, h, c, .35, 1.3, 'rx="0.15"');
      [-h / 4, 0, h / 4].forEach(y => { let p = `M${f3(-w / 2 + .3)} ${f3(y)}`; for (let x = -w / 2 + .3; x < w / 2 - .5; x += .5) p += `q.125 -.15 .25 0t.25 0`; s += P(p, `fill:none;stroke:${c};stroke-width:1.2`); });
      return s;
    },
    desplumadora: (w, h, c) => {
      let s = tinte(w, h, c, .22, 1.3, 'rx="0.12"'); const n = Math.max(2, Math.floor(w / .7)), r = Math.min(.28, h * .18);
      for (let i = 0; i < n; i++) { const x = -w / 2 + (i + .5) * w / n; s += Ci(x, -h / 4, r, 'fill:none;stroke:var(--muro);stroke-width:1') + Ci(x, h / 4, r, 'fill:none;stroke:var(--muro);stroke-width:1'); }
      return s;
    },
    eviscerado: (w, h, c) => {
      let s = tinte(w, h, c, .2) + Ln(-w / 2 + .2, 0, w / 2 - .2, 0, `${MURO};stroke-width:2`);
      for (let x = -w / 2 + .6; x < w / 2; x += 1) s += Ln(x, -h / 2 + .15, x, -.2, FINO) + Ln(x, .2, x, h / 2 - .15, FINO);
      return s;
    },
    chiller: (w, h, c) => {
      let s = tinte(w, h, c, .3, 1.3, `rx="${f3(h / 2)}"`);
      for (let x = -w / 2 + h / 2; x < w / 2 - h / 3; x += .6) s += Ln(x, -h / 2 + .15, x + .4, h / 2 - .15, `stroke:${c};stroke-width:1.2`);
      return s;
    },
    tunel_lavado: (w, h, c) => tinte(w, h, c, .3) + Ln(-w / 2 + .3, -h / 4, w / 2 - .3, -h / 4, `stroke:${c};stroke-width:1.2;stroke-dasharray:2 4`) + Ln(-w / 2 + .3, h / 4, w / 2 - .3, h / 4, `stroke:${c};stroke-width:1.2;stroke-dasharray:2 4`) +
      Ln(-w / 2 + .4, 0, w / 2 - .5, 0, `${MURO};stroke-width:1.3`) + P(`M${f3(w / 2 - .8)} -.25L${f3(w / 2 - .4)} 0L${f3(w / 2 - .8)} .25`, `fill:none;${MURO};stroke-width:1.3`),
    maquina: (w, h, c) => { const r = Math.min(w, h) * .24; return tinte(w, h, c, .28, 1.3, 'rx="0.12"') + Ci(0, 0, r, 'fill:none;stroke:var(--muro);stroke-width:2.5;stroke-dasharray:2 2') + Ci(0, 0, r * .45, 'fill:var(--muro)'); },
    mesa: (w, h) => RC(w, h, `fill:var(--mob);${MURO};stroke-width:1.2`) + RC(Math.max(w - .16, 0), Math.max(h - .16, 0), FINO),
    cinta: (w, h) => {
      let s = RC(w, h, `fill:var(--mob);${MURO};stroke-width:1.2`);
      for (let x = -w / 2 + .3; x < w / 2; x += .3) s += Ln(x, -h / 2 + .06, x, h / 2 - .06, FINO);
      return s;
    },
    lavamanos: (w, h, c) => RC(w, h, `fill:var(--mob);${MURO};stroke-width:1.2`) + El(0, 0, w * .3, h * .3, `fill:${c};fill-opacity:.4;stroke:var(--muro);stroke-width:1`),
    evaporador: (w, h, c) => { let s = tinte(w, h, c, .3); const n = Math.max(1, Math.floor(w / h)); for (let i = 0; i < n; i++) s += ventilador(-w / 2 + (i + .5) * w / n, 0, h * .36); return s; },
    compresor: (w, h, c) => { let s = tinte(w, h, c, .25); const n = Math.max(1, Math.floor(w / h)); for (let i = 0; i < n; i++) s += ventilador(-w / 2 + (i + .5) * w / n, 0, h * .38); return s; },
    caldera: (w, h, c) => El(0, 0, w / 2, h / 2, 'fill:var(--piso)') + El(0, 0, w / 2, h / 2, `fill:${c};fill-opacity:.3;${MURO};stroke-width:1.3`) + El(0, 0, w / 4, h / 4, FINO),
    tanque: (w, h, c) => El(0, 0, w / 2, h / 2, 'fill:var(--piso)') + El(0, 0, w / 2, h / 2, `fill:${c};fill-opacity:.35;${MURO};stroke-width:1.4`) + El(0, 0, w * .32, h * .32, 'fill:none;stroke:var(--muro);stroke-width:1;stroke-dasharray:4 3'),

    balanza: (w, h, c) => RC(w, h, `fill:var(--piso);${MURO};stroke-width:2`) + RC(Math.max(w - .24, 0), Math.max(h - .24, 0), `fill:${c};fill-opacity:.28`) +
      Ln(-w / 2 + .12, -h / 2 + .12, w / 2 - .12, h / 2 - .12, FINO) + Ln(-w / 2 + .12, h / 2 - .12, w / 2 - .12, -h / 2 + .12, FINO) + R(w / 2 + .08, -.22, .22, .44, 'fill:var(--muro)'),
    balanza_mesa: (w, h, c) => RC(w, h, `fill:var(--mob);${MURO};stroke-width:1.2`) + RC(w * .7, h * .6, `fill:${c};fill-opacity:.35`),
    bascula: (w, h, c) => {
      let s = RC(w, h, `fill:var(--hormigon);${MURO};stroke-width:1.6`) + RC(w, h, `fill:${c};fill-opacity:.14`);
      for (let x = -w / 2 + 3; x < w / 2 - .1; x += 3) s += Ln(x, -h / 2, x, h / 2, `${MURO};stroke-width:1`);
      return s;
    },
    zorra: (w, h, c) => R(-w / 2, h / 2 - .45, w, .45, `fill:${c};${MURO};stroke-width:1.1`) +
      R(-w / 2 + .04, -h / 2, .17, h - .45, `fill:var(--mob);${MURO};stroke-width:1`) + R(w / 2 - .21, -h / 2, .17, h - .45, `fill:var(--mob);${MURO};stroke-width:1`) +
      Ln(0, h / 2 - .2, 0, h / 2 + .25, `${MURO};stroke-width:2`),
    autoelevador: (w, h, c) => R(-w / 2, -h / 2 + .95, w, h - .95, `fill:${c};${MURO};stroke-width:1.3`, 'rx="0.15"') +
      Ln(-w / 2, -h / 2 + .95, w / 2, -h / 2 + .95, `${MURO};stroke-width:2.6`) +
      R(-w / 2 + .15, -h / 2, .14, .95, 'fill:var(--muro)') + R(w / 2 - .29, -h / 2, .14, .95, 'fill:var(--muro)') +
      Ci(0, -h / 2 + 1.55, .22, 'fill:var(--casco);stroke:var(--muro);stroke-width:1'),
    pallet: (w, h, c) => RC(w, h, `fill:var(--mob);${MURO};stroke-width:1`) + RC(w * .86, h * .86, `fill:${c};fill-opacity:.3;stroke:var(--fino);stroke-width:1`) + Ln(-w / 2, 0, w / 2, 0, FINO) + Ln(0, -h / 2, 0, h / 2, FINO),
    cajones: (w, h, c) => RC(w, h, `fill:${c};fill-opacity:.75;${MURO};stroke-width:1`) + RC(w * .7, h * .6, 'fill:none;stroke:var(--piso);stroke-width:1'),
    rack: (w, h, c) => {
      let s = RC(w, h, `fill:var(--piso);stroke:${c};stroke-width:1.6`);
      for (let x = -w / 2 + 1.35; x < w / 2 - .05; x += 1.35) s += Ln(x, -h / 2, x, h / 2, `stroke:${c};stroke-width:1.2`);
      s += Ln(-w / 2, 0, w / 2, 0, 'stroke:var(--fino);stroke-width:.8;stroke-dasharray:3 3');
      return s;
    },

    calle: (w, h, c) => RC(w, h, `fill:${c}`) + Ln(-w / 2, 0, w / 2, 0, 'stroke:var(--via);stroke-width:2.4;stroke-dasharray:12 9') +
      Ln(-w / 2, -h / 2 + .3, w / 2, -h / 2 + .3, 'stroke:var(--via);stroke-width:1.2') + Ln(-w / 2, h / 2 - .3, w / 2, h / 2 - .3, 'stroke:var(--via);stroke-width:1.2'),
    retorno: (w, h, c) => {
      const R0 = w / 2, cy = -h / 2, ri = Math.max(R0 - Math.min(5, R0 * .9), .1), rm = (R0 + ri) / 2;
      return P(`M${f3(-R0)} ${f3(cy)}A${f3(R0)} ${f3(R0)} 0 0 0 ${f3(R0)} ${f3(cy)}L${f3(ri)} ${f3(cy)}A${f3(ri)} ${f3(ri)} 0 0 1 ${f3(-ri)} ${f3(cy)}Z`, `fill:${c}`) +
        P(`M${f3(-rm)} ${f3(cy)}A${f3(rm)} ${f3(rm)} 0 0 0 ${f3(rm)} ${f3(cy)}`, 'fill:none;stroke:var(--via);stroke-width:2.4;stroke-dasharray:12 9');
    },
    playon: (w, h, c) => {

      for (let x = -w / 2; x <= w / 2 + .01; x += 2.5) s += Ln(x, -h / 2, x, h / 2 - .6, 'stroke:var(--via);stroke-width:1.6');

    senda: (w, h) => {

    alameda: (w, h) => {

    camion: (w, h, c) => `<g transform="scale(${f3(w / 8.2)} ${f3(h / 2.5)}) translate(-4.1 0)">` +

      R(6.05, -1.12, 2.15, 2.24, `fill:var(--veh);${MURO};stroke-width:1.5`, 'rx="0.55"') +
      P('M7 -.95Q7.75 0 7 .95L7.35 .95Q8.05 0 7.35 -.95Z', 'fill:var(--muro)') + R(6.9, -1.36, .25, .22, 'fill:var(--muro)') + R(6.9, 1.14, .25, .22, 'fill:var(--muro)') + `</g>`,

const H = { pila: [], futuro: [], ultimo: null };
const foto = () => JSON.stringify({ nombre: S.nombre, predio: S.predio, objs: S.objs });
function aplicarFoto(js) {
  const d = JSON.parse(js);
  S.nombre = d.nombre || S.nombre; S.predio = d.predio; S.objs = d.objs;
  S.sel = new Set([...S.sel].filter(id => S.objs.some(o => o.id === id)));
  $('#nombreDiseno').value = S.nombre;
}
function confirmar() { /* registra el estado actual como un paso */
  const f = foto();
  if (f === H.ultimo) return;
  if (H.ultimo) { H.pila.push(H.ultimo); if (H.pila.length > 120) H.pila.shift(); }
  H.ultimo = f; H.futuro = [];
  sucio(); botonesHist();
}
function reiniciarHist() { H.pila = []; H.futuro = []; H.ultimo = foto(); botonesHist(); }
function deshacer() { if (!H.pila.length) return; H.futuro.push(foto()); H.ultimo = H.pila.pop(); aplicarFoto(H.ultimo); sucio(); todo(); botonesHist(); }
function rehacer() { if (!H.futuro.length) return; H.pila.push(foto()); H.ultimo = H.futuro.pop(); aplicarFoto(H.ultimo); sucio(); todo(); botonesHist(); }
function botonesHist() { $('#b-deshacer').disabled = !H.pila.length; $('#b-rehacer').disabled = !H.futuro.length; }
let tBorrador = 0;
function sucio() {
  $('#estado').textContent = S.guardadoEn ? 'Cambios sin guardar' : 'Sin guardar';
  clearTimeout(tBorrador);
  tBorrador = setTimeout(() => lsSet('planta-borrador', { nombre: S.nombre, predio: S.predio, objs: S.objs, docId: S.docId }), 400);
}

}
function textoEtiqueta(o) {
  const t = TIPOS[o.tipo];
  if (o.tipo === 'cota') return (o.nombre ? o.nombre + ' · ' : '') + nf(o.w) + ' m';

  const largo = o.w >= o.h, L = largo ? o.w : o.h, C = largo ? o.h : o.w;
  let ang = normRot(o.rot + (largo ? 0 : 90));
  if (ang > 90) ang -= 180; if (ang <= -90) ang += 180;
  let fs, x = o.x, y = o.y;
  if (o.tipo === 'texto') fs = o.h * .62;
  else if (o.tipo === 'cota') { fs = clamp(Math.min(1.1, L * 1.4 / (txt.length * .55)), .3, 1.1); const a = rad(o.rot), dd = fs * .8; x = o.x + Math.sin(a) * dd; y = o.y - Math.cos(a) * dd; }

  return `<text x="${f3(x)}" y="${f3(y)}" transform="rotate(${f3(ang)} ${f3(x)} ${f3(y)})" style="font:700 ${f3(fs)}px 'Source Sans 3',sans-serif;fill:${color};paint-order:stroke;stroke:var(--hoja);stroke-width:3px;stroke-linejoin:round" text-anchor="middle" dominant-baseline="central">${esc(txt)}</text>`;
}

svg.addEventListener('pointermove', e => {

  if (G.modo === 'pinza' && G.punteros.size === 2) {
    const [a, b] = [...G.punteros.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = aMundo({ clientX: (a.x + b.x) / 2, clientY: (a.y + b.y) / 2 });
    if (d > 0 && G.dist > 0) zoom(G.dist / d, mid.x, mid.y);

  }
  if (!G.movido && Math.hypot(e.clientX - G.cli.x, e.clientY - G.cli.y) < 3) return;

  if (G.modo === 'pan') {
    const k = pxm(); vb.x -= (e.clientX - G.cli.x) * k; vb.y -= (e.clientY - G.cli.y) * k;
    G.cli = { x: e.clientX, y: e.clientY }; dibujar(); return;
  }

    if (!G.orig.length) return;
    const a = G.orig.find(q => q.id === G.ancla.id) || G.orig[0];
    const dx = snap(a.x + p.x - G.ini.x) - a.x, dy = snap(a.y + p.y - G.ini.y) - a.y;

  }
});
function finGesto(e) {

  if (m === 'pan' && !G.movido) { if (G.selId) { S.sel = new Set([G.selId]); G.selId = null; todo(); } else if (S.sel.size) { S.sel.clear(); todo(); } return; }
  if (m === 'marco') {

  const o = obj(tipo, snap(x), snap(y), t.w, t.h, { nivel: S.nivel === 'PA' ? 'PA' : 'PB' });
  const mismo = S.objs.filter(q => q.tipo === tipo).length;
  o.nombre = mismo ? `${t.n} ${mismo + 1}` : t.n;

  S.objs.push(o); S.sel = new Set([o.id]);

  [['f-x', o.x], ['f-y', o.y], ['f-w', o.w], ['f-h', o.h], ['f-rot', o.rot]].forEach(([id, v]) => { const i = document.getElementById(id); if (i && document.activeElement !== i) i.value = f3(v); });
}
insp.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'f-filtro') { G.filtroLista = e.target.value; const pos = e.target.selectionStart; inspDiseno(); const i = $('#f-filtro'); i.focus(); i.setSelectionRange(pos, pos); return; }
  const o = seleccion()[0]; if (!o) return;
  const v = e.target.value, n = parseFloat(v);
  switch (id) {
    case 'f-nombre': o.nombre = v; insp.querySelector('h2').textContent = v || TIPOS[o.tipo].n; break;
    case 'f-x': if (isFinite(n)) o.x = f3(n); break;
    case 'f-y': if (isFinite(n)) o.y = f3(n); break;
    case 'f-w': if (n > 0) o.w = f3(n); break;
    case 'f-h': if (n > 0) o.h = f3(n); break;
    case 'f-rot': if (isFinite(n)) o.rot = normRot(n); break;
    case 'f-alto': if (n >= 0) o.alto = f3(n); break;
    case 'f-notas': o.notas = v; break;
    case 'f-color': o.c = v; break;
    default: return;
  }
  dibujar();
});
insp.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'p-w' || id === 'p-h') {
    const n = Math.max(10, parseFloat(e.target.value) || 10), p = S.predio;
    if (id === 'p-w') p.x1 = f3(p.x0 + n); else p.y1 = f3(p.y0 + n);
    confirmar(); todo(); return;
  }
  const o = seleccion()[0];
  if (o) {
    if (id === 'f-nivel') o.nivel = e.target.value;
    if (id === 'f-ver') o.verNombre = e.target.checked;
    if (id === 'f-fijo') o.fijo = e.target.checked;
  }
  if (id === 'f-filtro') return;
  confirmar();
  if (['f-nivel', 'f-ver', 'f-fijo', 'f-color', 'f-w', 'f-h'].includes(id)) todo();
});
insp.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ir) { const o = buscarObj(b.dataset.ir); S.sel = new Set([o.id]); if (!visible(o)) ponerNivel('todo'); centrarEn(o); todo(); return; }
  if (b.dataset.color) { seleccion().forEach(o => o.c = b.dataset.color); confirmar(); todo(); return; }
  if (b.dataset.amp) { ampliar(b.dataset.amp, e.shiftKey ? 1 : 10); return; }
  const a = b.dataset.a;
  if (a === 'izq') girar(-90); if (a === 'der') girar(90); if (a === 'izq15') girar(-15); if (a === 'der15') girar(15);
  if (a === 'dup') duplicar(); if (a === 'borrar') borrar(); if (a === 'frente') aOrden(true); if (a === 'atras') aOrden(false);
  if (a === 'nivelPB' || a === 'nivelPA') { seleccion().forEach(o => o.nivel = a.slice(5)); confirmar(); todo(); }
});
function ampliar(lado, m) {
  const p = S.predio;
  if (lado === 'n' || lado === 'todo') p.y0 -= m;
  if (lado === 's' || lado === 'todo') p.y1 += m;
  if (lado === 'o' || lado === 'todo') p.x0 -= m;
  if (lado === 'e' || lado === 'todo') p.x1 += m;
  confirmar(); todo(); aviso(`Predio: ${nf(p.x1 - p.x0, 1)} × ${nf(p.y1 - p.y0, 1)} m`);
}
function centrarEn(o) {
  const k = Math.max(o.w, o.h) * 4 + 10;
  if (vb.w > k * 3 || vb.w < Math.max(o.w, o.h)) { const W = svg.clientWidth || 800, Hh = svg.clientHeight || 600; vb.w = Math.max(k, 20); vb.h = vb.w * Hh / W; }
  vb.x = o.x - vb.w / 2; vb.y = o.y - vb.h / 2;
}

document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select') || $('#dlg').open) return;
  if ($('#vista-plano').hidden) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (k === ' ') { G.espacio = true; e.preventDefault(); return; }
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? rehacer() : deshacer(); return; }
  if (mod && k === 'y') { e.preventDefault(); rehacer(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicar(); return; }
  if (mod && k === 'c') { portapapeles = JSON.parse(JSON.stringify(seleccion())); if (portapapeles.length) aviso('Copiado'); return; }
  if (mod && k === 'v') { if (portapapeles && portapapeles.length) { duplicar(portapapeles, 2, 2); portapapeles = portapapeles.map(o => ({ ...o, x: o.x + 2, y: o.y + 2 })); } return; }
  if (mod && k === 'a') { e.preventDefault(); S.sel = new Set(S.objs.filter(o => visible(o) && !tenue(o)).map(o => o.id)); todo(); return; }
  if (mod && k === 's') { e.preventDefault(); guardar(); return; }
  if (k === 'delete' || k === 'backspace') { e.preventDefault(); borrar(); return; }
  if (k === 'escape') { S.sel.clear(); todo(); return; }
  if (k === 'r' && !mod) { girar(e.shiftKey ? -90 : 90); return; }
  const d = e.shiftKey ? 1 : .1;
  if (k === 'arrowleft') { e.preventDefault(); mover(-d, 0); } if (k === 'arrowright') { e.preventDefault(); mover(d, 0); }
  if (k === 'arrowup') { e.preventDefault(); mover(0, -d); } if (k === 'arrowdown') { e.preventDefault(); mover(0, d); }
  if (k === '+' || k === '=') zoom(.8); if (k === '-') zoom(1.25);
});

let dbP = null;
const conDb = () => dbP || (dbP = (window.claude && claude.use ? claude.use('db') : Promise.resolve(null)).catch(() => null));
const plazo = (p, ms = 10000) => Promise.race([p, new Promise((_, r) => setTimeout(() => r({ code: 'tiempo', message: 'No respondió a tiempo' }), ms))]);
const datosDiseno = () => ({ nombre: S.nombre, actualizado: Date.now(), cantidad: S.objs.length, predio: JSON.stringify(S.predio), datos: JSON.stringify({ v: 1, nombre: S.nombre, predio: S.predio, objs: S.objs }) });
async function guardar(comoNuevo = false) {
  const db = await conDb();
  const datos = datosDiseno();
  $('#estado').textContent = 'Guardando…';
  try {
    if (db) {
      if (S.docId && !comoNuevo) await plazo(db.doc('disenos/' + S.docId).set(datos));
      else { const ref = await plazo(db.collection('disenos').add(datos)); S.docId = ref.id; }
    } else {
      const loc = lsGet('planta-guardados') || {};
      if (!S.docId || comoNuevo || !String(S.docId).startsWith('loc')) S.docId = 'loc' + Date.now().toString(36);
      loc[S.docId] = datos; lsSet('planta-guardados', loc);
    }
    S.guardadoEn = Date.now(); sucio();
    $('#estado').textContent = 'Guardado ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    aviso(db ? 'Diseño guardado' : 'Guardado en este navegador');
  } catch (err) {
    $('#estado').textContent = 'No se pudo guardar';
    aviso('No se pudo guardar: ' + ((err && err.message) || 'error'));
  }
}
$('#b-guardar').onclick = () => guardar();

function cargarDatos(d, docId = null) {
  if (!d || !Array.isArray(d.objs)) throw new Error('El archivo no tiene elementos de plano.');
  S.nombre = d.nombre || 'Diseño sin nombre';
  S.predio = d.predio && isFinite(d.predio.x0) ? d.predio : { x0: -18, y0: -20, x1: 76, y1: 64 };
  S.objs = d.objs.filter(o => o && TIPOS[o.tipo]).map(o => Object.assign({ rot: 0, nivel: 'PB', alto: TIPOS[o.tipo].alto }, o, { id: o.id || nuevoId() }));
  S.sel.clear(); S.docId = docId; S.guardadoEn = docId ? Date.now() : null;
  $('#nombreDiseno').value = S.nombre;
  reiniciarHist(); ponerNivel('todo'); encuadrar(); inspector();
  $('#estado').textContent = docId ? 'Abierto' : 'Sin guardar';
  if (!$('#vista-3d').hidden) Vista3D.mostrar();
  lsSet('planta-borrador', { nombre: S.nombre, predio: S.predio, objs: S.objs, docId: S.docId });
}

async function descargar(nombre, blob, alternativa) {
  let dl = null; try { dl = await (window.claude && claude.use ? claude.use('downloads') : null); } catch (e) { }
  if (!dl) {
    if (!window.claude) { try { const u = URL.createObjectURL(blob), el = document.createElement('a'); el.href = u; el.download = nombre; document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); aviso('Archivo descargado'); return; } catch (e) { } }
    alternativa(); return;
  }
  try { await dl.save({ filename: nombre, data: blob }); aviso('Archivo listo'); }
  catch (err) { if (err && err.code === 'declined') aviso('Descarga cancelada'); else alternativa(); }
}
function png() {
  const p = S.predio, m = 6, W = p.x1 - p.x0 + 2 * m, Hh = p.y1 - p.y0 + 2 * m;
  const ancho = 2600, alto = Math.round(ancho * Hh / W);
  const cs = getComputedStyle(document.documentElement);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${ancho}" height="${alto}" viewBox="${p.x0 - m} ${p.y0 - m} ${W} ${Hh}"><style>*{vector-effect:non-scaling-stroke}</style>` + cuerpoSVG(true) +
    `<text x="${p.x0 - m + 1}" y="${p.y0 - m + 2.2}" style="font:700 2px 'Source Sans 3',sans-serif;fill:var(--tinta)">${esc(S.nombre)}</text></svg>`;
  s = s.replace(/var\((--[\w-]+)\)/g, (_, n) => cs.getPropertyValue(n).trim() || '#888');
  return new Promise((ok, mal) => {
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = ancho; c.height = alto; const g = c.getContext('2d'); g.drawImage(img, 0, 0); c.toBlob(b => b ? ok(b) : mal(), 'image/png'); };
    img.onerror = mal;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  });
}

/* ============================================================
   VISTA 3D (three.js), generada desde los mismos elementos
   ============================================================ */
const Vista3D = (() => {
  let cargando = null, R3, escena, cam, ctl, raiz, centro = { x: 0, y: 0, r: 50 };
  const host = $('#gl'), aviso3 = $('#aviso3d');
  const script = src => new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
  const asegurar = () => cargando || (cargando = script('https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js').then(() => script('https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js')));
  const colorDe = c => c && c.startsWith('--') ? (tok(c) || '#999999') : (c || '#999999');
  const mats = new Map();
  function mat(color, op = 1) {
    const k = color + '|' + op;
    if (!mats.has(k)) mats.set(k, new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: .82, metalness: 0, transparent: op < 1, opacity: op, side: op < 1 ? THREE.DoubleSide : THREE.FrontSide }));
    return mats.get(k);
  }
  const mezcla = (c, base, t) => new THREE.Color(base).lerp(new THREE.Color(c), t).getStyle();
  function caja(g, cx, cy, w, h, z0, alto, m, sombra = true) {
    const o = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w, .02), Math.max(alto, .02), Math.max(h, .02)), m);
    o.position.set(cx, z0 + alto / 2, cy); o.castShadow = sombra; o.receiveShadow = true; g.add(o); return o;
  }
  function cil(g, cx, cy, rx, ry, z0, alto, m) {
    const r = Math.min(rx, ry), o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, alto, 28), m);
    o.scale.set(rx / r, 1, ry / r); o.position.set(cx, z0 + alto / 2, cy); o.castShadow = o.receiveShadow = true; g.add(o); return o;
  }
  function esfera(g, x, y, z, r, m, sy = 1) { const o = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m); o.scale.y = sy; o.position.set(x, z, y); o.castShadow = true; g.add(o); return o; }
  function construirObj(o, i) {
    const t = TIPOS[o.tipo], g = new THREE.Group();
    const col = colorDe(o.c || t.c), alto = o.alto ?? t.alto, w = o.w, h = o.h, z0 = t.z0 || 0;
    const base = o.nivel === 'PA' ? NPT_PA : 0;
    const eps = t.capa * .004 + (i % 50) * .0004;
